<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bea's Bakery</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="image-container justify-content">
        <img id="logo" src="images/beaslogo2.webp" class="img-fluid centered-image" alt="logo">
    </div>
    <div class="container-fluid" id="greenbar">
        <div class="row">
            <div class="col-xs-0 col-md-4">
            </div>
            <div class="col-xs-12 col-md-4">
                <div class="topnav">
                    <a class="active" href="index.html" aria-label="Home">Home</a>
                    <a href="products.html" aria-label="Products">Products</a>
                    <a href="about.html" aria-label="About">About</a>
                    <a href="contact.html" aria-label="Contact">Contact</a>
                    <a href="#" aria-label="Shopping Cart" data-bs-toggle="modal" data-bs-target="#shoppingCartModal">Shopping Cart</a>
                  </div> 
            </div>
            <div class="col-xs-0 col-md-4">
            </div>
        </div>
    </div>
    <div class="modal" id="shoppingCartModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Shopping Cart</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">  
            <ul id="cart" class="list-group"></ul>
          </div>
          <div class="modal-footer">
            <span id="totalPrice" class="me-auto">Total Price: 0 kr</span>
          </div>
        </div>
      </div>
    </div>
      <div class="container-fluid" id="greenBackground">
        <img class="img-fluid" id="background1" src="images/fika1.png" alt="background image">
        <div class="text-overlay">
            <h1>Welcome to Bea's Bakery<br></h1>
            <p id="opening-hours">Open 09:00-16:00<br>Monday-Sunday</p>
      </div>
    <script src="scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
